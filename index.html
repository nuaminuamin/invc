<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Operations Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col">

    <header class="sticky top-0 z-30 glass border-b border-slate-200 dark:border-slate-800 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-boxes-stacked text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">INVENTORY</h1>
                    <p class="text-xs font-semibold text-blue-600 dark:text-blue-400">YKC X SCO</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Theme Toggle Button -->
                <button id="themeToggle" class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow">
        <!-- Hero Header -->
        <div class="text-center max-w-2xl mx-auto mb-8">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-2">
                Akses Cepat Spreadsheet Operasional
            </h2>
            <p class="text-slate-600 dark:text-slate-400 text-sm sm:text-base">
                Kelola data Inventory, Impor, dan Distribusi Solo Raya dalam satu tempat.
            </p>
        </div>

        <!-- Search Bar and Category Filter Controls -->
        <div class="mb-8 flex flex-col sm:flex-row gap-4 items-center justify-between">
            <!-- Search Input -->
            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Cari spreadsheet..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm transition-all">
            </div>

            <!-- Category Pills Filter -->
            <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-start sm:justify-end" id="filterContainer">
                <button data-category="all" class="filter-btn active-filter px-4 py-2 text-xs font-semibold rounded-lg border transition-all bg-blue-600 text-white border-blue-600">
                    Semua
                </button>
                <button data-category="inventory" class="filter-btn px-4 py-2 text-xs font-semibold rounded-lg border transition-all bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-blue-500">
                    <i class="fa-solid fa-boxes-stacked mr-1 text-blue-500"></i> Inventory
                </button>
                <button data-category="impor" class="filter-btn px-4 py-2 text-xs font-semibold rounded-lg border transition-all bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-blue-500">
                    <i class="fa-solid fa-plane-arrival mr-1 text-emerald-500"></i> Impor
                </button>
                <button data-category="solo" class="filter-btn px-4 py-2 text-xs font-semibold rounded-lg border transition-all bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-blue-500">
                    <i class="fa-solid fa-location-dot mr-1 text-amber-500"></i> Solo Raya
                </button>
            </div>
        </div>

        <div id="linksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Items rendered dynamically via Javascript -->
        </div>

        <!-- Empty State Message -->
        <div id="noResults" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-700 dark:text-slate-300">Spreadsheet Tidak Ditemukan</h3>
            <p class="text-xs text-slate-500 mt-1">Coba kata kunci lain atau pilih kategori yang berbeda.</p>
        </div>
    </main>

    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 bg-white dark:bg-slate-900 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 dark:text-slate-400">
            Internal Operations Dashboard &bull; Access Quick Portal
        </div>
    </footer>

    <script>
        /* Data links kantor */
        const sheetsData = [
            {
                id: "inv-1",
                title: "INVENTORY PRODUK & LAYOUT",
                category: "inventory",
                categoryLabel: "Inventory",
                badgeColor: "bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300",
                iconClass: "fa-solid fa-sitemap text-blue-500",
                desc: "Tata letak gudang, denah rak, dan pemetaan posisi produk.",
                url: "https://docs.google.com/spreadsheets/d/16FeA0S07DTz5o-t6HORN10ry59L-ox015Xk95gDHbSQ/edit?hl=id&gid=159820582#gid=159820582"
            },
            {
                id: "inv-2",
                title: "INVENTORY STOCK",
                category: "inventory",
                categoryLabel: "Inventory",
                badgeColor: "bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300",
                iconClass: "fa-solid fa-boxes-stacked text-blue-500",
                desc: "Pencatatan real-time jumlah stok barang di gudang utama.",
                url: "https://docs.google.com/spreadsheets/d/1_VAQTCTueALc9CME_klP2IkHiKkgbsyF5zVHqFpTGHQ/edit?hl=id&gid=0#gid=0"
            },
            {
                id: "inv-3",
                title: "INVENTORY OPNAME",
                category: "inventory",
                categoryLabel: "Inventory",
                badgeColor: "bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300",
                iconClass: "fa-solid fa-clipboard-check text-blue-500",
                desc: "Laporan audit fisik & pembaruan selisih stok berkala.",
                url: "https://docs.google.com/spreadsheets/d/1AN3eMVZJ6gvvZGpInwFahvO5gMhUd9ZV1cfMlpomUdI/edit?gid=0#gid=0"
            },
            {
                id: "imp-1",
                title: "IMPOR TRACKING",
                category: "impor",
                categoryLabel: "Impor",
                badgeColor: "bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300",
                iconClass: "fa-solid fa-truck-fast text-emerald-500",
                desc: "Status pengiriman, estimasi kedatangan, & tracking kontainer.",
                url: "https://docs.google.com/spreadsheets/d/1igSv8Z4_PIRhoeEeOgB_QNldp5zww9zDS_JAyWI1aQQ/edit?hl=id&pli=1&gid=1344930343#gid=1344930343"
            },
            {
                id: "imp-2",
                title: "LIST PRODUK IMPOR",
                category: "impor",
                categoryLabel: "Impor",
                badgeColor: "bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300",
                iconClass: "fa-solid fa-list-check text-emerald-500",
                desc: "Daftar katalog & rincian spesifikasi barang impor.",
                url: "https://docs.google.com/spreadsheets/d/1RvFAu72o6C95-WgNlhCr9YtHFwUumPN-2BhpT-Zqll4/edit?pli=1&gid=1835875947#gid=1835875947"
            },
            {
                id: "solo-1",
                title: "SOLO LIST REQUEST",
                category: "solo",
                categoryLabel: "Solo Raya",
                badgeColor: "bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300",
                iconClass: "fa-solid fa-file-invoice text-amber-500",
                desc: "Permintaan barang & pengajuan distribusi area Solo Raya.",
                url: "https://docs.google.com/spreadsheets/d/1AmmJX1v85pLW5gUhm2aNnhLm7frnmadCuNYmRVn4KLg/edit?pli=1&gid=106176622#gid=106176622"
            },
            {
                id: "solo-2",
                title: "SOLO LIST PICKING",
                category: "solo",
                categoryLabel: "Solo Raya",
                badgeColor: "bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300",
                iconClass: "fa-solid fa-hand-holding-hand text-amber-500",
                desc: "Daftar pengambilan & verifikasi barang pengiriman Solo Raya.",
                url: "https://docs.google.com/spreadsheets/d/1rrO5bAY8ieOzRrmYGEyfnjjzBo5ekTQgKLnM6-gd32E/edit?gid=0#gid=0"
            }
        ];

        /* State management variables */
        let activeCategory = 'all';
        let searchQuery = '';

        /* DOM Elements */
        const linksGrid = document.getElementById('linksGrid');
        const noResults = document.getElementById('noResults');
        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        function renderCards() {
            const filtered = sheetsData.filter(item => {
                const matchesCategory = activeCategory === 'all' || item.category === activeCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.desc.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                linksGrid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            linksGrid.innerHTML = filtered.map(item => `
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700/80 p-5 shadow-sm hover:shadow-md hover:border-blue-500 dark:hover:border-blue-500 transition-all flex flex-col justify-between group">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-2.5 py-1 text-[11px] font-semibold rounded-md ${item.badgeColor}">
                                ${item.categoryLabel}
                            </span>
                            <span class="text-xs text-slate-400 group-hover:text-blue-500 transition-colors">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </span>
                        </div>
                        <div class="flex items-start space-x-3 mb-2">
                            <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-700/50 flex-shrink-0">
                                <i class="${item.iconClass} text-xl"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-bold text-slate-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                                    ${item.title}
                                </h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">
                                    ${item.desc}
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                        <span class="text-[11px] text-slate-400 font-medium">Google Sheets Document</span>
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 dark:bg-blue-900/30 dark:hover:bg-blue-900/50 text-blue-600 dark:text-blue-400 text-xs font-semibold transition-colors">
                            <span>Buka Sheet</span>
                            <i class="fa-solid fa-chevron-right text-[10px]"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderCards();
        });

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                    b.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border-slate-200', 'dark:border-slate-700');
                });

                btn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border-slate-200', 'dark:border-slate-700');
                btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');

                activeCategory = btn.dataset.category;
                renderCards();
            });
        });

        themeToggleBtn.addEventListener('click', () => {
            const html = document.documentElement;
            if (html.classList.contains('light')) {
                html.classList.remove('light');
                html.classList.add('dark');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        });

        // Initial render on page load
        window.onload = function() {
            renderCards();
        };
    </script>
</body>
</html>
